version: "3.9"

services:

  # ── PostgreSQL ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: L7062006v.
      POSTGRES_DB: moviedb
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moviedb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI backend ─────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL:        postgresql+asyncpg://postgres:L7062006v.@db:5432/moviedb
      KINOPOISK_API_TOKEN: ${KINOPOISK_API_TOKEN:-be3d601e-35cf-4e76-880d-fe3bc496aeea}
      KINOPOISK_API_URL:   ${KINOPOISK_API_URL:-https://kinopoiskapiunofficial.tech}
      KINOPOISK_STARTUP_SYNC_ENABLED: ${KINOPOISK_STARTUP_SYNC_ENABLED:-true}
      KINOPOISK_STARTUP_SYNC_MAX_PAGES: ${KINOPOISK_STARTUP_SYNC_MAX_PAGES:-0}
      KINOPOISK_SYNC_REQUEST_DELAY_SECONDS: ${KINOPOISK_SYNC_REQUEST_DELAY_SECONDS:-0.25}
      KINOPOISK_SYNC_ORDER: ${KINOPOISK_SYNC_ORDER:-RATING}
      KINOPOISK_SYNC_TYPE: ${KINOPOISK_SYNC_TYPE:-}
      KINOPOISK_SYNC_USE_FILTERS: ${KINOPOISK_SYNC_USE_FILTERS:-true}
      KINOPOISK_SYNC_COLLECTION_TYPES: ${KINOPOISK_SYNC_COLLECTION_TYPES:-TOP_POPULAR_ALL,TOP_POPULAR_MOVIES,TOP_250_MOVIES,TOP_250_TV_SHOWS,POPULAR_SERIES,FAMILY,KIDS_ANIMATION_THEME,COMICS_THEME,CATASTROPHE_THEME,LOVE_THEME,ZOMBIE_THEME,VAMPIRE_THEME}
      KINOPOISK_SYNC_COLLECTION_MAX_PAGES: ${KINOPOISK_SYNC_COLLECTION_MAX_PAGES:-50}
      KINOPOISK_SYNC_FETCH_DETAILS: ${KINOPOISK_SYNC_FETCH_DETAILS:-false}
      KINOPOISK_ENRICH_ON_DETAIL_ENABLED: ${KINOPOISK_ENRICH_ON_DETAIL_ENABLED:-true}
      KODIK_TOKEN:         ${KODIK_TOKEN:-}
      ALLOHA_TOKEN:        ${ALLOHA_TOKEN:-}
      VIDEOCDN_TOKEN:      ${VIDEOCDN_TOKEN:-}
      BAZON_TOKEN:         ${BAZON_TOKEN:-}
    expose:
      - "8000"
    volumes:
      - .:/app

  # ── Nginx + Frontend ────────────────────────────────────
  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
